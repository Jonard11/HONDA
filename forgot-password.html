<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — Honda Inventory System</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-wrap"><i class="fa-solid fa-key"></i></div>
      <h1>Reset <span>Password</span></h1>
      <p>Honda Inventory System</p>
    </div>
    <p style="text-align:center;font-size:.875rem;color:var(--gray-400);margin-bottom:22px;">Enter your email and we'll send a reset link.</p>
    <div class="alert alert-danger d-none" id="errAlert"><i class="fa-solid fa-circle-exclamation"></i><span id="errMsg"></span></div>
    <div class="alert alert-success d-none" id="okAlert"><i class="fa-solid fa-circle-check"></i><span>Reset link sent! Check your inbox.</span></div>
    <form id="resetForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap"><i class="fa-solid fa-envelope icon"></i>
          <input type="email" id="email" placeholder="Enter your email" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-red btn-block" id="resetBtn">
        <i class="fa-solid fa-paper-plane"></i> Send Reset Link
      </button>
    </form>
    <a href="index.html" class="auth-footer-link" style="margin-top:16px;"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { firebaseConfig } from "./js/firebase-config.js";
    const auth = getAuth(initializeApp(firebaseConfig));
    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('resetBtn');
      const err = document.getElementById('errAlert');
      const ok  = document.getElementById('okAlert');
      if (!email) { document.getElementById('errMsg').textContent='Enter your email.'; err.classList.remove('d-none'); return; }
      btn.disabled=true; btn.innerHTML='<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span>';
      err.classList.add('d-none');
      try {
        await sendPasswordResetEmail(auth, email);
        ok.classList.remove('d-none'); document.getElementById('resetForm').reset();
      } catch(ex) {
        document.getElementById('errMsg').textContent = ex.code==='auth/user-not-found'?'No account with that email.':'Failed to send reset email.';
        err.classList.remove('d-none');
      } finally { btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Send Reset Link'; }
    });
  </script>
</body>
</html>
